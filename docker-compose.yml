services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      PROJECTS_DIR: /projects
      # Optional AI review (sends repository source to Anthropic). Leave unset to keep everything local.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS:-}
      LLM_STREAM: ${LLM_STREAM:-}
      TERMINAL_URL: http://terminal:8002
      TERMINAL_TOKEN: ${TERMINAL_TOKEN:?run `make run` (it creates TERMINAL_TOKEN in .env)}
      LLM_MAX_CHARS: ${LLM_MAX_CHARS:-}
      # Clones use SSH through your forwarded ssh-agent; no private key is copied into the container.
      SSH_AUTH_SOCK: /run/host-services/ssh-auth.sock
    volumes:
      - workspace:/workspace
      - ${PROJECTS_DIR:-./projects}:/projects
      - ./samples:/samples   # writable: uploaded subjects are kept in samples/<track>/
      # your ssh-agent's socket (set by `make`: your $SSH_AUTH_SOCK on Linux, Docker Desktop's path on macOS)
      - ${SSH_AGENT_MOUNT:-/run/host-services/ssh-auth.sock}:/run/host-services/ssh-auth.sock
    networks: [default, sandbox-net]
    depends_on:
      sandbox:
        condition: service_healthy
      terminal:
        condition: service_started
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]  # only for the entrypoint to drop from root to uid 1000
    security_opt: ["no-new-privileges:true"]

  # Builds and runs the code under review. No outbound network: it is only on an
  # internal network shared with `web`.
  sandbox:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    environment:
      ALLOWED_ROOTS: /workspace:/projects
      DOCKER_HOST: tcp://dind:2375     # the separate daemon below, never your Mac's Docker
    volumes:
      - workspace:/workspace
      - ${PROJECTS_DIR:-./projects}:/projects
    networks: [sandbox-net, docker-net]
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # `claude` for the in-app terminal and the one-click review. It gets internet (to reach Anthropic) but none of the
  # web app's secrets: no .env, no ssh-agent, no other sessions. The projects folder is mounted read-write (set
  # TERMINAL_PROJECTS_MODE=ro to make it read-only again). By default claude and the shell work IN that folder (TERMINAL_WORKDIR=live),
  # so what they change is on your machine at once; TERMINAL_WORKDIR=copy makes them work on throw-away copies in /scratch instead.
  # Your Claude login lives in the `claude-home` volume. Your public keys (~/.ssh/*.pub only) are in ~/.ssh, read-only.
  terminal:
    build:
      context: .
      dockerfile: terminal/Dockerfile
    environment:
      TERMINAL_TOKEN: ${TERMINAL_TOKEN:?run `make run` (it creates TERMINAL_TOKEN in .env)}
      TERMINAL_WORKDIR: ${TERMINAL_WORKDIR:-live}
      DOCKER_HOST: tcp://dind:2375     # claude can build and run a student's Dockerfile on the separate daemon below
    networks: [default, docker-net]
    volumes:
      - ${PROJECTS_DIR:-./projects}:/projects:${TERMINAL_PROJECTS_MODE:-rw}
      - claude-home:/home/term
      - ./.ssh-pub:/home/term/.ssh:ro   # your ~/.ssh/*.pub only (`make pubkeys`); no private key
    tmpfs:
      - /scratch:exec,size=1g,uid=1000,gid=1000   # `exec`: claude builds and runs the project here
      - /tmp:size=256m,uid=1000,gid=1000
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 3s
      retries: 6

  # A Docker daemon of its own, so the sandbox and claude can build and run the Dockerfile a student ships.
  #  - ROOTLESS: the daemon runs as an unprivileged user, so a container that escapes lands there, not as root.
  #    (Rootless-in-Docker needs `privileged`; this is the only service that has it.)
  #  - It sees nothing of yours: no projects folder, no .env, no ssh-agent, and never the host's /var/run/docker.sock.
  #    It only receives what a docker client sends it (the build context) and keeps its images in the `docker-data` volume.
  #  - It has internet through `builds-net` because Dockerfiles download packages. Nothing else is on that network.
  #  - Not started by `web`: if it cannot run on your machine, everything else still works and `docker` just reports
  #    that it cannot reach a daemon.
  dind:
    image: docker:dind-rootless
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""           # plain tcp on the private docker-net only (nothing is published)
    volumes:
      - docker-data:/home/rootless/.local/share/docker
    networks: [docker-net, builds-net]
    pids_limit: 2048
    mem_limit: 4g
    cpus: 2
    healthcheck:
      test: ["CMD", "docker", "-H", "tcp://127.0.0.1:2375", "info"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  sandbox-net:
    internal: true
  docker-net:          # the sandbox, the terminal and the daemon only; no internet
    internal: true
  builds-net: {}       # internet for the daemon (Dockerfiles download packages); nothing else is on it

volumes:
  workspace:
  claude-home:
  docker-data:
