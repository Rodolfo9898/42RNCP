<!doctype html>
<html lang="en" data-theme="modern">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>verdict</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230078d4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/%3E%3Cpath d='M9 12l2 2 4-4'/%3E%3C/svg%3E">

<body>
  <!-- The workbench, laid out as VS Code lays it out. The parts are filled in by the scripts below (nothing is built from strings). -->
  <div id="workbench">
    <header id="titlebar">
      <div id="brand" aria-hidden="true"></div>
      <nav id="menubar" aria-label="Application Menu"></nav>
      <div id="command-center"></div>
      <div id="title-actions"></div>
    </header>
    <div id="main">
      <nav id="activitybar" aria-label="Active View Switcher"></nav>
      <aside id="sidebar" aria-label="Primary Side Bar"></aside>
      <div id="sash-sidebar" class="sash" role="separator" aria-orientation="vertical" tabindex="0" title="Drag to resize. Double click to reset."></div>
      <div id="center">
        <main id="editor-area" aria-label="Editor"></main>
        <div id="sash-panel" class="sash" role="separator" tabindex="0" title="Drag to resize. Double click to reset."></div>
        <section id="panel" aria-label="Panel"></section>
      </div>
      <div id="sash-secondary" class="sash" role="separator" aria-orientation="vertical" tabindex="0" title="Drag to resize. Double click to reset."></div>
      <aside id="secondary" aria-label="Secondary Side Bar"></aside>
    </div>
    <footer id="statusbar" role="status"></footer>
  </div>

  <div id="menu-layer"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="modal" hidden><div class="dialog" id="dialog" role="dialog" aria-modal="true"></div></div>
  <input type="file" id="file-input" accept="application/pdf,.pdf" multiple hidden>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="lib.js"></script>
  <script src="model.js"></script>
  <script src="core.js"></script>
  <script src="commands.js"></script>
  <script src="fileicons.js"></script>
  <script src="layout.js"></script>
  <script src="menus.js"></script>
  <script src="editors.js"></script>
  <script src="fileview.js"></script>
  <script src="minimap.js"></script>
  <script src="terminals.js"></script>
  <script src="views.js"></script>
  <script src="scm.js"></script>
  <script src="quickinput.js"></script>
  <script src="statusbar.js"></script>
  <script src="settings-ui.js"></script>
  <script src="app.js"></script>
  <script src="workbench-commands.js"></script>
  <script src="boot.js"></script>
</body>
</html>
