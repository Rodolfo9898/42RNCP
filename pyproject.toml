[project]
name = "verdict"
version = "0.1.0"
description = "Check a Git repository against one or more project subject PDFs and produce a verdict.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "pymupdf>=1.25",
    "httpx>=0.27",
    "anthropic>=1.0",
    "pygments>=2.21.0",
    "websockets>=13",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdict"]

[[tool.uv.index]]
url = "https://pypi.apple.com/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
